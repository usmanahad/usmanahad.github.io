<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research paper viewer</title>
  <link rel="stylesheet" href="./vendor/pdf_viewer.css">
  <link rel="stylesheet" href="./viewer.css">
</head>
<body>
  <nav class="paper-toolbar" aria-label="Paper controls">
    <button id="previous" type="button" aria-label="Previous page" disabled>&lsaquo;</button>
    <label for="page-number">Page</label>
    <input id="page-number" type="number" min="1" value="1" aria-label="Page number" disabled>
    <span id="page-count" aria-live="polite">/ —</span>
    <button id="next" type="button" aria-label="Next page" disabled>&rsaquo;</button>
    <select id="zoom" aria-label="Paper zoom" disabled>
      <option value="page-width">Fit width</option>
      <option value="0.75">75%</option>
      <option value="1">100%</option>
      <option value="1.5">150%</option>
      <option value="2">200%</option>
    </select>
    <a id="open-pdf" target="_blank" rel="noopener" hidden>Open PDF</a>
  </nav>
  <div id="viewerContainer" tabindex="0" role="region" aria-label="Scrollable paper pages">
    <div id="viewer" class="pdfViewer"></div>
  </div>
  <p id="viewer-status" role="status">Loading paper…</p>
  <noscript><p class="no-script">Use the Open PDF link on the project page to read this paper.</p></noscript>
  <script src="./viewer.mjs?v=safari-1" type="module"></script>
</body>
</html>
